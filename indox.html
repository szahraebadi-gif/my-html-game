<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>آموزش گام‌به‌گام ضرب تک‌جمله‌ای‌ها</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--navy:#232b5a;--cream:#fffbf0;--orange:#ffa31f;--blue:#3a4bcc;--g:#2ecc71;--r:#e74c3c}
*{box-sizing:inherit}
body{margin:0;min-height:100vh;background:linear-gradient(#5bc0ff,#b6e8ff);font-family:Tahoma,"Vazirmatn",sans-serif;color:var(--navy);display:flex;justify-content:center;overflow:hidden;height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
html{overflow:hidden}
.wrap{width:100%;max-width:520px;height:100%;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.top{display:flex;gap:8px;align-items:center}
.btn{border:3px solid var(--navy);border-radius:16px;padding:6px 10px;font:inherit;font-size:14px;font-weight:800;color:var(--navy);background:var(--orange);box-shadow:0 5px 0 var(--navy);cursor:pointer}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--navy)}
.btn:disabled{background:#e9e4d6;opacity:.7}
.score{margin-inline-start:auto;background:var(--cream);cursor:default}
.card{background:var(--cream);border:4px solid var(--navy);border-radius:22px;box-shadow:0 6px 0 var(--navy);padding:10px}
.eq{display:flex;justify-content:center;align-items:center;gap:8px;direction:ltr;font-size:26px;font-weight:800;flex-wrap:wrap}
.chip{border:3px solid var(--navy);border-radius:12px;padding:1px 10px;min-width:44px;text-align:center;font-weight:800}
.cg{background:#bff2d3}.cr{background:#ffc9c2}
.box{background:#e6eeff;border-color:var(--navy);outline:3px solid var(--orange);outline-offset:2px;min-width:56px;height:46px;display:flex;align-items:center;justify-content:center}
.box.ok{background:#fff0c4}
.q{margin-top:8px;text-align:center;font-size:15px;font-weight:800;line-height:1.9}
.q .chip{display:inline-block;direction:ltr;unicode-bidi:isolate;padding:0 7px;font-size:14px;min-width:0;border-width:2px;border-radius:9px}
.hint{display:none;margin-top:6px;background:#ffe3a8;border:2px dashed var(--navy);border-radius:12px;padding:6px;font-weight:800;text-align:center;font-size:13px}
.stage{flex:1;min-height:0;display:flex;align-items:center;padding:6px 8px}
.line{position:relative;width:100%;height:110px;direction:ltr}
.bar{position:absolute;left:0;right:0;top:66px;height:3px;background:linear-gradient(90deg,transparent,var(--navy) 4%,var(--navy) 96%,transparent);border-radius:2px}
.tick{position:absolute;top:61px;width:2px;height:13px;background:var(--navy);opacity:.75;transform:translateX(-50%);border-radius:1px}
.lab{position:absolute;top:80px;transform:translateX(-50%);font-size:12px;font-weight:800;white-space:nowrap}
.orb{position:absolute;top:58px;width:20px;height:20px;margin-left:-10px;border-radius:50%;border:2px solid var(--navy);box-shadow:inset -3px -3px 0 rgba(0,0,0,.18),0 2px 0 var(--navy)}
.orb.g{background:var(--g)}.orb.r{background:var(--r)}
.orb.me{transition:left .32s linear;z-index:3}
.orb i{display:block;width:100%;height:100%;border-radius:50%}
.drop{animation:drop .8s cubic-bezier(.3,1.5,.5,1) both}
@keyframes drop{from{transform:translateY(-90px);opacity:0}to{transform:none;opacity:1}}
.hop{animation:hop .32s ease-out}
@keyframes hop{50%{transform:translateY(-26px)}}
.cnt{position:absolute;top:0;transform:translateX(-50%);background:var(--cream);border:2px solid var(--navy);border-radius:10px;padding:0 8px;font-weight:800;font-size:15px;transition:left .32s linear;z-index:4;opacity:0}
.cnt.on{opacity:1}
.msg{min-height:22px;text-align:center;font-weight:800;font-size:14px}
.btns{display:flex;gap:14px}
.dir{flex:1;padding:11px 0;font-size:19px;border-radius:18px;background:var(--orange)}
#R{background:var(--blue);color:#fff}
.dir.sel{outline:5px solid #fff;outline-offset:2px}
.go{width:100%;padding:11px 0;font-size:19px;background:var(--blue);color:#fff;border-radius:18px}
.fly{position:fixed;z-index:9;border:3px solid var(--navy);border-radius:12px;background:#fff0c4;font-weight:800;font-size:26px;padding:1px 10px;transition:all .8s ease-in-out;direction:ltr}
.shake{animation:sh .4s}
@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.foot{text-align:center;font-weight:800;font-size:12px;opacity:.85}

.q{font-size:16px;margin-top:0}
.sub{text-align:center;font-size:12px;font-weight:700;opacity:.8}
.scale{display:flex;align-items:center;gap:6px;direction:ltr;font-size:12px;font-weight:800;margin-bottom:6px}
.scale i{flex:1;height:3px;background:var(--navy);border-radius:2px;position:relative}
.scale i::after{content:"";position:absolute;right:-2px;top:-5px;border:6px solid transparent;border-left:9px solid var(--navy);border-right:0}
.slots{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;direction:ltr}
.slot{height:44px;border:2px dashed var(--navy);border-radius:12px;background:#e6eeff;display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative}
.slot::before{content:attr(data-n);position:absolute;top:-9px;right:6px;background:var(--cream);border-radius:8px;padding:0 5px;font-size:10px;font-weight:800}
.slot.f{border-style:solid;background:var(--cream)}
.slot.ok{background:#bff2d3}.slot.bad{background:#ffc9c2;animation:sh .4s}
.nc{border:2px solid var(--navy);border-radius:10px;min-width:0;flex:1;height:38px;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:800;direction:ltr;box-shadow:0 3px 0 var(--navy);touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;padding:0 2px}
.slot .nc{box-shadow:none;border:0;background:transparent;pointer-events:none;height:auto}
.ng{background:#bff2d3}.nr{background:#ffc9c2}.nz{background:#ffe3a8}
.nc.sel{outline:4px solid var(--orange);outline-offset:2px}
.slot .nc.ng,.slot .nc.nr,.slot .nc.nz{background:transparent}
.pool{display:flex;flex-wrap:nowrap;gap:6px;justify-content:center;align-items:center;width:100%}
.ghost{min-width:50px;flex:none!important;position:fixed;z-index:30;pointer-events:none;transform:scale(1.15) rotate(-4deg);opacity:.95}
.rnd{background:var(--cream);cursor:default}
.ov{position:fixed;inset:0;background:rgba(35,43,90,.55);display:none;align-items:center;justify-content:center;z-index:40}
.ov .card{text-align:center;width:min(88%,380px);font-weight:800;line-height:2}
.big{font-size:38px;line-height:1.3}
.lv{width:100%;padding:11px 0;font-size:17px;border-radius:16px;margin-top:8px}
.extxt{text-align:right;font-size:14px;line-height:2;font-weight:700}

.grps{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grp{min-height:104px;border:2px dashed var(--navy);border-radius:12px;background:#e6eeff;padding:16px 6px 6px;position:relative;display:flex;flex-wrap:wrap;gap:5px;align-content:flex-start;cursor:pointer}
.grp::before{content:attr(data-n);position:absolute;top:-1px;right:8px;background:var(--navy);color:#fff;border-radius:0 0 8px 8px;padding:0 8px;font-size:11px;font-weight:800}
.grp.ok{background:#bff2d3;border-style:solid}.grp.bad{background:#ffc9c2;animation:sh .4s}
.nt{background:#cfe0ff;font-size:19px;height:38px;white-space:nowrap;padding:0 8px;font-family:"Cambria Math","STIX Two Math","Times New Roman",Georgia,serif;font-weight:700;letter-spacing:.3px}
.pool .nt{flex:1 1 22%;min-width:auto}
.grp .nt{flex:1 1 calc(50% - 5px);background:#fff0c4;height:32px;box-shadow:none;cursor:pointer}
.v{font-family:"Cambria Math","STIX Two Math","Times New Roman",Georgia,serif;font-weight:700}
.co{font-family:"Vazirmatn",Tahoma,sans-serif;font-weight:800}
.v{font-style:italic;font-size:1.12em;margin-left:1px}
.extxt .v,.extxt .co{font-size:1.15em}
sup{font-family:"Vazirmatn",Tahoma,sans-serif;font-size:.78em;font-weight:800;color:#c0392b;position:relative;top:-.5em;vertical-align:baseline;line-height:0;margin:0 1px 0 1px}
.extxt{font-size:13.5px}
.pool.two{display:grid;grid-template-columns:1fr 1fr}
.pool.two .nt{flex:none}

:root{--orange:#b388ff;--blue:#16a085}
.eq{font-size:22px}
.tm{font-family:"Cambria Math","STIX Two Math","Times New Roman",Georgia,serif;font-weight:700;padding:2px 10px;font-size:21px;white-space:nowrap}
.alab{font-size:12px;font-weight:800;margin-bottom:6px;text-align:center}
.abox{min-height:50px;display:flex;align-items:center;justify-content:center;direction:ltr;font-size:28px;font-weight:700;background:#fff;border:3px solid var(--navy);border-radius:14px;outline:3px solid var(--orange);outline-offset:2px;padding:0 10px}
.abox.ok{background:#bff2d3}.abox.bad{background:#ffc9c2;animation:sh .4s}
.kp{display:flex;flex-direction:column;gap:5px;direction:ltr}
.kr{display:grid;gap:5px}
.krl{display:flex;justify-content:center;gap:8px}
.key{border:3px solid var(--navy);border-radius:10px;height:34px;font-size:18px;font-weight:800;color:var(--navy);box-shadow:0 3px 0 var(--navy);touch-action:none;user-select:none;-webkit-user-select:none;cursor:pointer;display:flex;align-items:center;justify-content:center;min-width:0}
.key:active{transform:translateY(2px);box-shadow:0 1px 0 var(--navy)}
.krl .key{width:58px}
.ks{background:#2ec4b6}.kd{background:#d6c8ff}.kv{background:#ffb3d6;font-family:"Cambria Math","Times New Roman",serif;font-style:italic;font-size:22px}.ke{background:#e3f56a}.ka{background:#ffc9c2}
.key sup{top:-.45em}
.ghost.key{width:48px;pointer-events:none}
.key.off{opacity:.3}
.sub{font-size:13px;line-height:1.7;opacity:1}
.q{font-size:15px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <button class="btn" id="home">🏠 بازگشت</button>
    <button class="btn" id="next">بعدی ➡️</button>
    <div class="btn rnd">🎲 <span id="rn"></span></div>
    <div class="btn score">📍 <span id="sc"></span></div>
  </div>
  <div class="card">
    <div class="eq" id="eq"></div>
    <div class="q" id="qt"></div>
    <div class="sub" id="qs"></div>
  </div>
  <div class="card" id="ans"><div class="alab">✍️ جواب تو</div><div class="abox" id="abox">؟</div></div>
  <div class="card"><div class="kp" id="kp"></div></div>
  <div class="msg" id="msg"></div>
  <button class="btn go" id="check">💡 راهنمایی</button>
  <div class="foot">طراح: سمانه شریعتی بین کلایی | شهرستان آمل | استان مازندران</div>
</div>
<div class="ov" id="lvov" style="display:flex"><div class="card"><div class="big">✖️</div><div style="font-size:17px">سطح آموزش را انتخاب کن</div>
<button class="btn lv" data-l="e" style="background:#d9f7ec">🌱 آسان — یک متغیر بدون توان</button>
<button class="btn lv" data-l="m" style="background:#e3d4ff">🔥 متوسط — متغیرهای تواندار</button>
<button class="btn lv" data-l="h" style="background:#ffd1e8">🚀 سخت — چند متغیر و تواندار</button></div></div>
<div class="ov" id="rsov"><div class="card"><div class="big">🏆</div><div id="rstxt"></div><button class="btn go" id="rsok" style="margin-top:8px">🔄 انتخاب سطح</button></div></div>
<div class="ov" id="exov"><div class="card"><div style="font-size:18px">📘 جمع‌بندی این مثال</div><div class="extxt" id="extxt"></div><button class="btn go" id="exok" style="margin-top:8px">فهمیدم ✔️</button></div></div>
<script>
const fa=n=>String(n).replace(/\d/g,d=>"۰۱۲۳۴۵۶۷۸۹"[d]);
const $=id=>document.getElementById(id);
const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const shuf=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
let AC=null;
function ac(){try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume();}catch(e){}return AC}
function tone(f,d,type,v,delay,f2){if(!AC)return;const t=AC.currentTime+(delay||0),o=AC.createOscillator(),g=AC.createGain();o.type=type||"sine";o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v||.15,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.02);}
const snd={
 click(){ac();tone(600,.06,"triangle",.1)},
 drop(){tone(500,.25,"sine",.12,0,180);tone(450,.2,"sine",.1,.22,170)},
 hop(n){const k=Math.min(n,12)*40;tone(380+k,.14,"triangle",.18,0,620+k)},
 lift(){tone(500,.2,"sine",.12,0,900)},
 whoosh(){tone(300,.7,"sawtooth",.05,0,1200)},
 bad(){tone(200,.25,"square",.08,0,120)},
 win(){[523,659,784,1047].forEach((f,k)=>tone(f,.2,"triangle",.15,k*.11))}
};



const NAMES={e:"آسان",m:"متوسط",h:"سخت"};
const LETTERS=["x","y","z","a","b","t"];
const TOTAL=10;
let lvl="e",r=0,q=null,tokens=[],steps=[],si=0,wrongs=0,busy=false,solved=false,session=0;
const keyOf=L=>Object.keys(L).sort().map(v=>v+L[v]).join("");
const litHtml=L=>Object.keys(L).sort().map(v=>`<span class="v">${v}</span>${L[v]>1?`<sup>${fa(L[v])}</sup>`:""}`).join("");
const termHtml=t=>`<span class="co">${t.c<0?"−":""}${Math.abs(t.c)!==1?fa(Math.abs(t.c)):""}</span>${litHtml(t.L)}`;
const fm=c=>(c<0?"−":"")+fa(Math.abs(c));
const coef=()=>(Math.random()<.5?-1:1)*(lvl==="e"||Math.random()>.2?rnd(2,9):1);
function genQ(){
  let L1={},L2={};
  if(lvl==="e"){const v=shuf(["x","y","a","b","t"])[0];L1[v]=1;L2[v]=1;}
  else if(lvl==="m"){
    const vars=shuf(LETTERS.slice()).slice(0,rnd(1,2));
    vars.forEach(v=>L1[v]=rnd(1,3));
    vars.forEach(v=>{if(Math.random()<.85)L2[v]=rnd(1,3)});
    if(!Object.keys(L2).length)L2[vars[0]]=rnd(1,3);
  }else{
    const vars=shuf(LETTERS.slice()).slice(0,3);
    let ok=false;
    while(!ok){
      L1={};L2={};
      shuf(vars.slice()).slice(0,rnd(2,3)).forEach(v=>L1[v]=rnd(1,3));
      shuf(vars.slice()).slice(0,rnd(2,3)).forEach(v=>L2[v]=rnd(1,3));
      const common=Object.keys(L1).filter(v=>v in L2).length;
      const uni=new Set([...Object.keys(L1),...Object.keys(L2)]).size;
      ok=common>=1&&uni===3;
    }
  }
  const m1={c:coef(),L:L1},m2={c:coef(),L:L2},A={c:m1.c*m2.c,L:{}};
  [L1,L2].forEach(L=>Object.keys(L).forEach(v=>A.L[v]=(A.L[v]||0)+L[v]));
  const used=Object.keys(A.L);
  const extra=shuf(LETTERS.filter(v=>!used.includes(v)));
  const letters=shuf(used.concat(extra.slice(0,Math.max(1,4-used.length))));
  return {m1,m2,A,letters};
}
function tokHtml(){
  if(!tokens.length)return "؟";
  return tokens.map(t=>t.t==="s"?`<span class="co">${t.v==="-"?"−":"+"}</span>`:t.t==="d"?`<span class="co">${fa(t.v)}</span>`:t.t==="v"?`<span class="v">${t.v}</span>`:`<sup>${fa(t.v)}</sup>`).join("");
}
function show(cls){const b=$("abox");b.innerHTML=tokHtml();b.className="abox "+(cls||"");}
function buildKeys(){
  const row=(cls,cols,items)=>`<div class="kr" style="grid-template-columns:repeat(${cols},1fr)">${items}</div>`;
  const k=(c,t,v,label)=>`<div class="key ${c}" data-t="${t}" data-v="${v}">${label}</div>`;
  let h=row("",4,k("ks","s","-","−")+k("ks","s","+","+")+`<div class="key ka" data-a="back">⌫</div><div class="key ka" data-a="clr">🗑</div>`);
  h+=row("",10,["1","2","3","4","5","6","7","8","9","0"].map(d=>k("kd","d",d,fa(d))).join(""));
  h+=`<div class="krl">${q.letters.map(v=>k("kv","v",v,v)).join("")}</div>`;
  h+=row("",8,[1,2,3,4,5,6,7,8].map(n=>k("ke","e",n,`<span style="opacity:.45">□</span><sup>${fa(n)}</sup>`)).join(""));
  $("kp").innerHTML=h;
}
const KIND={s:"علامت",d:"عدد",v:"حرف",e:"توان"};
function buildSteps(){
  const {m1,m2,A}=q,S=[];
  const s1=m1.c<0?"−":"+",s2=m2.c<0?"−":"+",sg=A.c<0?"−":"+";
  S.push({k:"s",ex:A.c<0?"-":"+",title:"ضرب علامت‌ها",
    det:`علامت دو ضریب را ضرب کن: <bdi dir="ltr">(${s1}) × (${s2}) = ؟</bdi><br>هم‌علامت ← مثبت ، ناهم‌علامت ← منفی`,
    hint:"اگر دو علامت یکسان باشند حاصل مثبت (+) است و اگر متفاوت باشند حاصل منفی (−) است.",
    why:`<bdi dir="ltr">(${s1}) × (${s2}) = ${sg}</bdi> ، چون علامت‌ها ${s1===s2?"یکسان":"متفاوت"} هستند.`});
  const a1=Math.abs(m1.c),a2=Math.abs(m2.c),pr=a1*a2;
  S.push({k:"d",ex:String(pr),title:"ضرب عددها",
    det:`حالا عددها را بدون علامت ضرب کن: <bdi dir="ltr">${fa(a1)} × ${fa(a2)} = ؟</bdi><br>(جمله‌ای که عدد ندارد، ضریبش ۱ است)`,
    hint:"ضریب‌ها را مثل یک ضرب معمولی در هم ضرب کن؛ علامت را قبلاً مشخص کردی.",
    why:`<bdi dir="ltr">${fa(a1)} × ${fa(a2)} = ${fa(pr)}</bdi>`});
  Object.keys(A.L).sort().forEach((v,n)=>{
    const e1=m1.L[v]||0,e2=m2.L[v]||0,both=e1&&e2,V=`<span class="v">${v}</span>`;
    S.push({k:"v",ex:v,title:"نوشتن متغیر",
      det:`متغیرها را به ترتیب الفبا بنویس. متغیر ${fa(n+1)}ام جواب کدام است؟<br>(هر حرفی که در یکی از دو جمله باشد، در جواب هم می‌آید)`,
      hint:"حرف‌های هر دو جمله را کنار هم جمع کن و هر حرف را فقط یک بار، به ترتیب الفبا بنویس.",
      why:`متغیر ${fa(n+1)}ام ${V} است.`});
    S.push({k:"e",ex:String(e1+e2),title:"توان متغیر",
      det:both?`توان ${V} در جملهٔ اول ${fa(e1)} و در جملهٔ دوم ${fa(e2)} است (توانِ ننوشته یعنی ۱).<br>توان‌های هم‌پایه را جمع کن: <bdi dir="ltr">${fa(e1)} + ${fa(e2)} = ؟</bdi>`:`${V} فقط در یک جمله آمده و توانش ${fa(e1||e2)} است.<br>توان آن در جواب چند می‌شود؟`,
      hint:both?"در ضرب، وقتی پایه‌ها یکی هستند توان‌ها با هم جمع می‌شوند: مثلاً x²·x³ = x⁵":"متغیری که فقط در یک جمله است، بدون تغییر در جواب می‌آید.",
      hx:(x)=>both&&+x===e1*e2&&e1*e2!==e1+e2?"توان‌ها را باید جمع کنی، نه ضرب! ":"",
      why:both?`<bdi dir="ltr">${V}<sup>${fa(e1)}</sup> × ${V}<sup>${fa(e2)}</sup> = ${V}<sup>${fa(e1)}+${fa(e2)}</sup> = ${V}<sup>${fa(e1+e2)}</sup></bdi>`:`توان ${V} همان ${fa(e1||e2)} می‌ماند.`});
  });
  return S;
}
function setStep(){
  const st=steps[si];wrongs=0;busy=false;
  $("qt").innerHTML=`گام ${fa(si+1)} از ${fa(steps.length)}: ${st.title}`;
  $("qs").innerHTML=st.det;
  $("sc").textContent=fa(si+1)+"/"+fa(steps.length);
  document.querySelectorAll("#kp .key").forEach(k=>{const t=k.dataset.t,a=k.dataset.a;const on=t?t===st.k:(st.k==="d"&&!!a);k.classList.toggle("off",!on)});
  show();
}
function newRound(){
  session++;
  q=genQ();tokens=[];steps=buildSteps();si=0;solved=false;busy=false;
  $("eq").innerHTML=`<span class="chip cg tm">(${termHtml(q.m1)})</span><span>×</span><span class="chip cr tm">(${termHtml(q.m2)})</span>`;
  buildKeys();
  $("rn").textContent=fa(r+1)+"/"+fa(TOTAL);
  $("msg").textContent=`سطح ${NAMES[lvl]} — مثال ${fa(r+1)} از ${fa(TOTAL)}`;
  $("next").textContent=r>=TOTAL-1?"پایان 🏁":"بعدی ➡️";
  setStep();snd.drop();
}
function removeDigits(){while(tokens.length&&tokens[tokens.length-1].t==="d")tokens.pop()}
function undo(all){
  if(solved||busy||!steps[si]||steps[si].k!=="d")return;
  if(all)removeDigits();else if(tokens.length&&tokens[tokens.length-1].t==="d")tokens.pop();
  snd.click();show();
}
function advance(){si++;if(si>=steps.length)doneEx();else setStep();}
function doneEx(){
  solved=true;const b=$("abox");b.innerHTML=termHtml(q.A);b.className="abox ok";
  $("qt").textContent="🎉 تمام شد!";
  $("qs").textContent="حاصل ضرب را گام‌به‌گام پیدا کردیم. جمع‌بندی را ببین و به مثال بعدی برو.";
  $("sc").textContent="✔️";
  document.querySelectorAll("#kp .key").forEach(k=>k.classList.add("off"));
  $("msg").innerHTML=`✅ حاصل: <bdi dir="ltr">${termHtml(q.A)}</bdi>`;
  snd.win();const my=session;setTimeout(()=>{if(my===session)explain()},900);
}
function good(why){
  busy=true;show();$("msg").innerHTML=`✅ ${why}`;snd.hop(si+2);
  const my=session;setTimeout(()=>{if(my===session)advance()},1300);
}
function wrong(h){
  wrongs++;const st=steps[si],my=session;busy=true;
  if(wrongs>=2){
    if(st.k==="d"){removeDigits();st.ex.split("").forEach(d=>tokens.push({t:"d",v:d}))}
    else tokens.push({t:st.k,v:st.ex});
    show();$("msg").innerHTML=`💡 جواب این گام: ${st.why}`;snd.lift();
    setTimeout(()=>{if(my===session)advance()},2400);
  }else{
    $("abox").className="abox bad";$("msg").innerHTML=`❌ ${h}`;snd.bad();
    setTimeout(()=>{if(my===session){busy=false;show()}},1100);
  }
}
function apply(k){
  if(solved||busy)return;
  const st=steps[si];
  if(k.t!==st.k){$("msg").innerHTML=`در این گام باید یک کلید <b>${KIND[st.k]}</b> بزنی 🙂`;snd.bad();return}
  if(st.k==="d"){
    const n=()=>tokens.filter(x=>x.t==="d").length;
    if(n()>=st.ex.length)return;
    tokens.push(k);snd.click();show();
    if(n()===st.ex.length){
      const dg=tokens.filter(x=>x.t==="d").map(x=>x.v).join("");
      if(dg===st.ex)good(st.why);else{removeDigits();wrong(st.hint)}
    }
    return;
  }
  if(k.v===st.ex){tokens.push(k);good(st.why)}
  else wrong((st.hx?st.hx(k.v):"")+st.hint);
}
let drag=null;
$("kp").addEventListener("pointerdown",e=>{
  const c=e.target.closest(".key");if(!c)return;ac();
  drag={el:c,x:e.clientX,y:e.clientY,ghost:null};
  try{c.setPointerCapture(e.pointerId)}catch(_){}
});
window.addEventListener("pointermove",e=>{
  if(!drag||!drag.el.dataset.t)return;
  if(!drag.ghost&&Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>8){
    const g=drag.el.cloneNode(true);g.classList.add("ghost");document.body.appendChild(g);drag.ghost=g;snd.lift();
  }
  if(drag.ghost){drag.ghost.style.left=e.clientX-drag.ghost.offsetWidth/2+"px";drag.ghost.style.top=e.clientY-drag.ghost.offsetHeight/2-28+"px";}
});
function endDrag(e,ok){
  if(!drag)return;const d=drag;drag=null;const el=d.el;
  if(d.ghost){
    d.ghost.remove();
    if(ok){const t=document.elementFromPoint(e.clientX,e.clientY);if(t&&t.closest("#ans"))apply({t:el.dataset.t,v:el.dataset.v});}
  }else if(ok){
    const a=el.dataset.a;
    if(a==="back")undo(false);
    else if(a==="clr")undo(true);
    else apply({t:el.dataset.t,v:el.dataset.v});
  }
}
window.addEventListener("pointerup",e=>endDrag(e,true));
window.addEventListener("pointercancel",e=>endDrag(e,false));
function explain(){
  const A=q.A,m1=q.m1,m2=q.m2;
  let h=`🔹 اول ضریب‌ها را ضرب کن: <bdi dir="ltr">(${fm(m1.c)}) × (${fm(m2.c)}) = ${fm(A.c)}</bdi><br>`;
  Object.keys(A.L).sort().forEach(v=>{
    const e1=m1.L[v]||0,e2=m2.L[v]||0,V=`<bdi dir="ltr"><span class="v">${v}</span></bdi>`;
    if(e1&&e2)h+=`🔹 متغیر ${V} در هر دو جمله هست؛ توان‌ها را جمع کن: <bdi dir="ltr">${fa(e1)} + ${fa(e2)} = ${fa(e1+e2)}</bdi><br>`;
    else h+=`🔹 متغیر ${V} فقط در یک جمله است؛ همان با توان ${fa(e1||e2)} می‌ماند.<br>`;
  });
  h+=`✅ حاصل: <bdi dir="ltr">${termHtml(A)}</bdi>`;
  $("extxt").innerHTML=h;$("exov").style.display="flex";
}
$("check").onclick=()=>{
  ac();if(busy)return;
  if(solved){explain();return}
  snd.click();$("msg").innerHTML=`💡 ${steps[si].hint}`;
};
function finish(){
  $("rstxt").innerHTML=`سطح ${NAMES[lvl]}<br>آفرین! ${fa(TOTAL)} مثال را گام‌به‌گام حل کردیم 🌟<br>آمادهٔ سطح بعدی هستی؟`;
  $("rsov").style.display="flex";snd.win();
}
$("rsok").onclick=()=>{snd.click();$("rsov").style.display="none";$("lvov").style.display="flex"};
$("exok").onclick=()=>{snd.click();$("exov").style.display="none"};
$("next").onclick=()=>{ac();snd.click();if(r>=TOTAL-1){finish();return}r++;newRound()};
document.querySelectorAll(".lv").forEach(b=>b.onclick=()=>{ac();snd.click();lvl=b.dataset.l;r=0;$("lvov").style.display="none";newRound()});
$("home").onclick=()=>{ac();snd.click();$("lvov").style.display="flex"};
newRound();
</script>
</body>
